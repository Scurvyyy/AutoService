<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Service - Auto Service</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .page-shell {
      width: min(760px, 100%);
    }

    .booking-card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .booking-title {
      margin-bottom: 18px;
    }

    .booking-title h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1;
    }

    .booking-title p {
      margin: 0;
      color: #94a3b8;
      line-height: 1.6;
    }

    .top-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .link-btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.18);
      font-weight: 700;
      text-decoration: none;
    }

    .link-btn.primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #052e16;
      border: none;
    }

    form {
      display: grid;
      gap: 10px;
    }

    .field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: #0b1220;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
    }

    .field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-btn {
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #052e16;
      cursor: pointer;
    }

    .small {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      margin: 2px 4px 2px 0;
    }

    .status {
      min-height: 18px;
      margin-top: 8px;
      color: #94a3b8;
      font-size: 13px;
    }

    .status.error {
      color: #ef4444;
    }

    .service-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 16px 0 20px;
    }

    .service-pill {
      padding: 14px;
      border-radius: 16px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #e5e7eb;
    }

    .service-pill span {
      display: block;
      margin-top: 6px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }

      .booking-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="booking-card">
      <div class="booking-title">
        <h1>Book Your Service</h1>
        <p>Choose your service, add your details, and send the booking instantly.</p>
      </div>

      <div class="top-links">
        <a class="link-btn" href="index.html">Back to home</a>
        <!-- <a class="link-btn" href="admin.html">Admin Login</a> -->
      </div>
 

      <form id="bookingForm">
        <input id="customerName" class="field" type="text" placeholder="Your name" required />
        <input id="customerPhone" class="field" type="tel" placeholder="Your phone number" required />

        <div class="row">
          <select id="serviceName" class="field" required>
            <option value="">Select service</option>
            <option>Oil Change</option>
            <option>Tire Service</option>
            <option>General Repair</option>
            <option>Parts & Maintenance</option>
          </select>
          <input id="bookingDate" class="field" type="date" required />
        </div>

        <textarea id="problemDescription" class="field" rows="4" placeholder="Describe the problem or add a note"></textarea>

        <button class="primary-btn" type="submit">Submit Booking</button>
      </form>

      <div class="status" id="bookingStatus"></div>

      <div class="small">
        Your booking will be saved to the system and shown in the admin dashboard.
      </div>
    </div>
  </div>
  
<script src="js/app.js"></script>
<script src="js/booking.js"></script>
<div id="toast" class="toast"></div>
</body>
</html>
