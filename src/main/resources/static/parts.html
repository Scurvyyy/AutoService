<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parts & Prices | Auto Service</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/parts.css" />
</head>
<body>
  <header class="market-header">
    <div class="market-topbar">
      <a class="market-brand" href="index.html">
        <span class="brand-mark">Logo</span>
        <span class="brand-text">Auto Service</span>
      </a>

      <div class="market-search">
        <input id="searchInput" type="text" placeholder="Search for parts or brands..." />
        <select id="filterStock">
          <option value="all">All stock</option>
          <option value="available">Available</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
      </div>

      <nav class="market-actions">
        <a href="booking.html">Book Service</a>
        <a href="admin.html" class="primary-link">Admin</a>
      </nav>
    </div>
  </header>

  <main class="market-layout">
    <aside class="sidebar">
      <h3>Shop by category</h3>
      <button class="cat-btn active" data-cat="all">All parts</button>
      <button class="cat-btn" data-cat="engine">Engine Parts</button>
      <button class="cat-btn" data-cat="oil">Oil & Fluids</button>
      <button class="cat-btn" data-cat="brake">Brake System</button>
      <button class="cat-btn" data-cat="electrical">Electrical</button>
      <button class="cat-btn" data-cat="tire">Tires & Wheels</button>
    </aside>

    <section class="market-main">
      <div class="hero-strip">
       <div>
          <p class="eyebrow">Авто сэлбэг </p>
          <h1>Таньд хэрэгтэй тохирсон сэлбэгээ зөв үнийн дүнтэй нь байгаа үгүйг шалгах боломжтой.</h1>
          <p>бас бусад цэснээс сонирхсон бараа сэлбэг хайх боломжтой</p>
        </div>
      </div>

      <section class="market-section">
        <div class="section-head">
          <h2>Best Selling</h2>
          <a href="#" class="see-all">See all</a>
        </div>
        <div class="parts-grid" id="partsGrid">
          <div class="parts-loading">Loading parts...</div>
        </div>
      </section>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/parts.js"></script>
</body>
</html>
